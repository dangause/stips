# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
    # The CLI reference imports stips.cli; stips depends on the workspace
    # package stips-refcats, so install that first. Neither needs the LSST stack.
    - method: pip
      path: packages/refcats
    - method: pip
      path: packages/stips
