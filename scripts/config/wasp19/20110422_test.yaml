# WASP-19 transit, TraMoS, 2011-04-22 (local night), Y4KCam 2x2 binned, Bessell I,
# 10-12 s cadence. Companion config to 20110422.yaml: picks up the 633 frames
# logged OBJECT = "test" (exact-match on object below) into the SAME repo as
# 20110422.yaml, so skip_calibs is true here -- calibs are built once by the
# "object" config. The coordinate check in _build_exclusions drops any "test"
# frames that do not point at WASP-19. Published: Cortes-Zuleta et al. 2020,
# A&A 636, A98, Table 1 (epoch -923, rms 4.31 mmag); light curve at VizieR
# J/A+A/636/A98. Which config contributes to the reported 626-point curve is
# TBD on the cluster run (Task 7 steps 3-8, deferred).
env:
  REPO: "/lustre/cv/users/dgause/stips/repos/wasp19_20110422_repo"
  STACK_DIR: "/opt/lsst/software/stack"
  INSTRUMENT_DIR: "/opt/stips/instruments/ctio1m_bin2"
  RAW_PARENT_DIR: "/lustre/cv/users/dgause/stips/raw"
  REFCAT_REPO: "/lustre/cv/users/dgause/stips/refcats"
object: "test"                # exact-match: picks up the 633 frames logged OBJECT = 'test'
# Gaia DR3 position (epoch 2016.0): ra=148.416760, dec=-45.659105,
# pmra=-35.46, pmdec=17.38 mas/yr (source match: G=12.10, as expected for
# WASP-19). Propagated to epoch 2011.6 (one position for both WASP-19
# nights, 2011.3-2012.0): shift 0.17" (174 mas) from the catalogue epoch.
ra: 148.416822
dec: -45.659127
bands: ["i"]
refcat:
  mode: gaia
  radius_deg: 0.25
template:
  type: none
science:
  nights:
    - 20110422
configs:
  science:
    colorterms: apply_colorterms.py
options:
  jobs: 22
  skip_calibs: true
  skip_science: false
  skip_dia: true
  forced_phot: true
  continue_on_error: true
  use_fallbacks: true
  pipeline_type: transit
  period_min: 0.5
  period_max: 5.0
  transit_duration_min: 1.0
  transit_duration_max: 4.0
  period_samples: 10000
lightcurve:
  enabled: true
  dataset_type: forced_phot_radec
  min_snr: 0
  y_axis: flux_nJy
  x_axis: mjd
