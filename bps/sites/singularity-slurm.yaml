# Small Telescope Image Processing Suite - Apptainer/Singularity + Slurm site
#
# For Slurm clusters whose compute nodes have no LSST stack: the STIPS image
# provides it, on the submit side and on every compute node.
#
#   1. Controller: `stips run` (or `stips bps submit`) runs inside the image,
#      started by scripts/hpc/stips-apptainer, which also binds in the host's
#      Slurm client so Parsl can call sbatch/sacct/scancel.
#   2. Workers: Parsl submits Slurm jobs ("blocks"). Each one starts the Parsl
#      worker pool inside the image (stips.core.bps_sites.ApptainerSlurm wraps
#      the launch command in `apptainer exec`), so every quantum's pipetask
#      runs with the stack the worker set up.
#
# Every value in {braces} comes from the run config's options.cluster block
# (see docs/hpc.md); the defaults are in stips.core.bps.BPSConfig.
#
# Usage:
#   scripts/hpc/stips-apptainer stips -c config.yaml run
#     (with options: execution: bps, site: singularity-slurm)

includeConfigs:
  - ../base.yaml

wmsServiceClass: lsst.ctrl.bps.parsl.ParslService
computeSite: singularity-slurm

# One job per visit: a job pays ~10 s of pipetask start-up, more than most
# per-visit tasks take to run (see stips.core.bps_clustering).
clusterAlgorithm: stips.core.bps_clustering.visit_clustering

parsl:
  log_level: INFO
  retries: 3

site:
  singularity-slurm:
    class: stips.core.bps_sites.ApptainerSlurm

    # One block = one Slurm job on one node. Parsl starts
    # min(cores_per_node, mem_per_node / mem_per_worker) workers in it, and
    # each worker runs one quantum at a time.
    nodes: 1
    cores_per_node: {cores_per_node}
    mem_per_node: {mem_per_node}         # GB
    mem_per_worker: {mem_per_worker}     # GB
    walltime: "{walltime}"
    partition: "{partition}"             # empty: the cluster's default
    account: "{account}"                 # empty: the user's default account
    exclusive: false

    # How many blocks Parsl may hold at once.
    max_blocks: {max_blocks}
    min_blocks: 0
    init_blocks: 1
    parallelism: 1.0

    # The image and what it sees. Empty `image` means the image the controller
    # runs in; empty `bind` means $STIPS_APPTAINER_BIND (set by
    # scripts/hpc/stips-apptainer from $STIPS_BIND). Host paths.
    image: "{container_image}"
    bind: "{container_bind}"

    # Run inside the image before the worker pool starts; every quantum
    # inherits this environment. One thread per quantum: Parsl already runs
    # one worker per core.
    worker_setup: |
      source /opt/lsst/software/stack/loadLSST.bash
      setup lsst_distrib
      setup -r "{obs_stips_dir}" obs_stips 2>/dev/null || true
      export INSTRUMENT_DIR="{instrument_dir}"
      export STIPS_DEFAULTS="{stips_defaults}"
      for pkg_dir in "$INSTRUMENT_DIR"/*/; do
          [ -d "${pkg_dir}ups" ] || continue
          for tbl in "${pkg_dir}ups/"*.table; do
              [ -e "$tbl" ] || continue
              setup -r "${pkg_dir%/}" "$(basename "$tbl" .table)" 2>/dev/null || true
          done
      done
      if [ -n "{obs_data_package}" ] && [ -d "{instrument_data_dir}" ]; then
          setup -r "{instrument_data_dir}" {obs_data_package} 2>/dev/null || true
      fi
      export PYTHONPATH="{instruments_root}:{stips_src}:${PYTHONPATH:-}"
      export NUMEXPR_MAX_THREADS=1 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1

    # Parsl's run directory (on the shared filesystem).
    run_dir: "{run_dir}"
