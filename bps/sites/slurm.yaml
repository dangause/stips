# Small Telescope Image Processing Suite - Slurm Site Configuration
#
# BPS configuration for Slurm-based HPC clusters using Parsl.
#
# Usage:
#   stips -c config.yaml bps submit calibs 20230519 --site slurm
#
# Customize for your cluster:
#   - partition: Your Slurm partition name
#   - account: Your allocation account
#   - walltime: Max job duration
#   - nodes/cores: Worker resources

includeConfigs:
  - ../base.yaml

# =============================================================================
# WMS Backend Selection
# =============================================================================
# Use Parsl with Slurm provider
wmsServiceClass: lsst.ctrl.bps.parsl.ParslService
computeSite: slurm

# One job per visit: a job pays ~10 s of pipetask start-up, more than most
# per-visit tasks take to run (see stips.core.bps_clustering).
clusterAlgorithm: stips.core.bps_clustering.visit_clustering

# =============================================================================
# Parsl Configuration
# =============================================================================
parsl:
  # Logging level for Parsl internals
  log_level: INFO

  # Retry behavior
  retries: 3

  # Monitoring (optional - uncomment if needed)
  # monitoring:
  #   enabled: true
  #   hub_address: localhost
  #   hub_port: 55055

# =============================================================================
# Slurm Site Definition
# =============================================================================
site:
  slurm:
    # StipsSlurm, not lsst.ctrl.bps.parsl.sites.Slurm: the latter ignores
    # partition, max_blocks, mem_per_worker and worker_init, and asks for
    # whole nodes (see stips.core.bps_sites).
    class: stips.core.bps_sites.StipsSlurm

    # One block = one Slurm job on one node, running
    # min(cores_per_node, mem_per_node / mem_per_worker) quanta at once.
    # Values in {braces} come from the run config's options.cluster block.
    nodes: 1
    cores_per_node: {cores_per_node}
    mem_per_node: {mem_per_node}         # GB
    mem_per_worker: {mem_per_worker}     # GB
    walltime: "{walltime}"
    partition: "{partition}"             # empty: the cluster's default
    account: "{account}"                 # empty: the user's default account
    exclusive: false

    # Extra #SBATCH lines for your cluster, e.g. mail on failure:
    scheduler_options: |
      #SBATCH --export=ALL

    # How many blocks Parsl may hold at once.
    max_blocks: {max_blocks}
    min_blocks: 0
    init_blocks: 1
    parallelism: 1.0

    # Worker options
    worker_init: |
      # Load modules if needed
      # module load python/3.11

      # Source LSST stack
      source {stack_dir}/loadLSST.bash
      setup lsst_distrib

      # STIPS framework: obs_stips (LSST glue) + stips (core, src-layout).
      # The instrument is imported by name (instruments.<name>); the repo root is on PYTHONPATH.
      export INSTRUMENT_DIR="{instrument_dir}"
      export STIPS_DEFAULTS="{stips_defaults}"
      if [[ -d "{obs_stips_dir}" ]]; then
          setup -r {obs_stips_dir} obs_stips 2>/dev/null || true
      fi
      export PYTHONPATH="{instruments_root}:${PYTHONPATH:-}"
      if [[ -d "{stips_src}" ]]; then
          export PYTHONPATH="{stips_src}:${PYTHONPATH:-}"
      fi
      if [[ -n "{obs_data_package}" && -d "{instrument_data_dir}" ]]; then
          setup -r "{instrument_data_dir}" {obs_data_package} 2>/dev/null || true
      fi

      # Export required environment variables
      export REPO={repo}

# =============================================================================
# Task-Specific Resource Overrides
# =============================================================================
# Adjust memory/CPU for specific pipeline tasks based on profiling

pipetask:
  # Calibration tasks
  cpBiasIsr:
    requestMemory: 2048
    requestCpus: 1

  cpBias:
    requestMemory: 4096
    requestCpus: 1

  cpFlatIsr:
    requestMemory: 4096
    requestCpus: 1

  cpFlat:
    requestMemory: 8192
    requestCpus: 2

  # Science processing tasks
  isr:
    requestMemory: 4096
    requestCpus: 1

  calibrateImage:
    requestMemory: 8192
    requestCpus: 2
    memoryMultiplier: 2.0
    numberOfRetries: 3

  # DIA tasks (memory intensive)
  rewarpTemplate:
    requestMemory: 8192
    requestCpus: 1

  subtractImages:
    requestMemory: 16384
    requestCpus: 2
    memoryMultiplier: 1.5
    numberOfRetries: 4

  detectAndMeasureDiaSource:
    requestMemory: 8192
    requestCpus: 1

  # Forced photometry
  forcedPhotDiffimRaDec:
    requestMemory: 4096
    requestCpus: 1
